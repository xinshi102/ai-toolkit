<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>主控台 · ai-collab</title>
<script>try{var t=localStorage.getItem('console-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#000;--s1:#080808;--s2:#111;--tx:#ededed;--tx2:#a1a1a1;--dim:#6b6b6b;--faint:#2a2a2a;--att:#f5a524;--bad:#f2555a;--gap:28px}
[data-theme=light]{--bg:#fafafa;--s1:#f3f3f3;--s2:#ebebeb;--tx:#171717;--tx2:#4d4d4d;--dim:#8f8f8f;--faint:#e2e2e2;--att:#b86e00;--bad:#d1242f}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
/* layout: no lines; whitespace separates. collapsed = 0 size */
.shell{position:relative;height:100vh;display:grid;padding:22px 28px;transition:grid-template-columns .22s ease}
.col{display:grid;min-width:0;min-height:0;transition:grid-template-rows .22s ease}
.pane{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;transition:opacity .18s}
.pane.gone{opacity:0;pointer-events:none}
.lbl{display:flex;align-items:center;gap:8px;height:24px;flex:none;font-size:12px;color:var(--dim);letter-spacing:.06em}
.lbl .sp{flex:1}.lbl .n{font-variant-numeric:tabular-nums}.lbl .n.att{color:var(--att)}
.lbl .hide{opacity:0;color:var(--dim);font-size:12px;letter-spacing:0;transition:opacity .15s}.pane:hover .lbl .hide{opacity:1}.lbl .hide:hover{color:var(--tx)}
.body{flex:1;min-height:0;overflow:auto;padding-top:6px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
/* invisible gutters to resize */
.gut{position:relative;min-width:0;min-height:0}
.gut.v{cursor:col-resize}.gut.h{cursor:row-resize}.gut.off{cursor:default;pointer-events:none}
/* edge handles for hidden panes: invisible until the pointer is near */
.edge{position:fixed;z-index:5;display:flex;align-items:center;justify-content:center}
.edge.l{left:0;top:0;bottom:0;width:14px}.edge.t{top:0;left:0;right:0;height:14px}.edge.b{bottom:0;left:0;right:0;height:14px}
.edge .pill{opacity:0;transform:scale(.9);transition:opacity .15s,transform .15s;background:var(--s2);color:var(--tx2);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.edge.l .pill{writing-mode:horizontal-tb;margin-left:64px}
.edge:hover .pill,.edge.drag .pill{opacity:1;transform:none}
.edge.l{cursor:e-resize}.edge.t{cursor:s-resize}.edge.b{cursor:n-resize}
.edge .hint{position:absolute;border-radius:2px;background:var(--att);opacity:0}
.edge.t.att .hint{opacity:.9;top:0;left:50%;width:36px;height:2px;transform:translateX(-50%)}
.edge.l.att .hint{opacity:.9;left:0;top:50%;width:2px;height:36px;transform:translateY(-50%)}
.edge[hidden]{display:none}
/* in-column hidden pane: same idea, an invisible strip at the column edge */
.cedge{height:12px;cursor:ns-resize;display:flex;justify-content:center;align-items:center}
.cedge .pill{opacity:0;transition:opacity .15s;background:var(--s2);color:var(--tx2);border-radius:999px;padding:0 10px;font-size:12px}
.cedge:hover .pill{opacity:1}
/* calm hero when everything is hidden */
.hero{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:0 10vw;pointer-events:none}
.hero h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.02em}.hero p{margin:10px 0 0;color:var(--tx2);font-size:16px}
.hero .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--att);margin-right:14px;transform:translateY(-4px);box-shadow:0 0 0 6px color-mix(in srgb,var(--att) 18%,transparent)}
.shell.empty .hero{display:flex}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.d.run{background:var(--tx2);animation:b 2s infinite}.d.att{background:var(--att)}.d.bad{background:var(--bad)}.d.done{background:var(--dim)}
@keyframes b{50%{opacity:.25}}
kbd{border:1px solid var(--faint);border-radius:4px;padding:0 5px;font:12px Consolas,monospace;color:var(--tx2)}
.foot{position:fixed;right:16px;bottom:10px;font-size:11.5px;color:var(--dim);opacity:.6}.foot:hover{opacity:1}.foot button{color:var(--dim)}.foot button:hover{color:var(--tx)}
.help{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);z-index:9}.help.on{display:flex}
.help>div{background:var(--s1);border-radius:12px;padding:18px 24px;line-height:2.1;color:var(--tx2);font-size:13px}
.n .tw{cursor:pointer}.tree-note{color:var(--tx2);margin:0 0 10px;white-space:pre-wrap}.dw-pre{overflow-wrap:anywhere}.pane:focus-within .lbl .hide{opacity:1}
</style>
<style>
/* tree */
.tree-wrap{container-type:inline-size;container-name:tree}
.ol .n{display:grid;grid-template-columns:12px 10px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.ol .n:hover,.ol .n.sel{background:var(--s1)}.ol .tw{color:var(--dim);font-size:10px}
.ol .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ol .m{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.ol .l1{padding-left:20px}.ol .l2{padding-left:36px}.ol .unc{margin-top:10px;color:var(--dim)}
.mm{display:none;position:relative}.mm svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mm .nd{position:absolute;transform:translate(0,-50%);background:var(--s1);border-radius:8px;padding:4px 10px;white-space:nowrap;font-size:13px;display:flex;gap:7px;align-items:center;cursor:pointer}
.mm .nd.root{font-weight:600}.mm .nd.sel{background:var(--s2)}.mm .nd em{font-style:normal;color:var(--dim);font-size:11.5px}
@container tree (min-width:720px){.ol{display:none}.mm{display:block}}
/* resources */
.res-wrap{container-type:inline-size;container-name:res}
.ag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:4px 0;font-size:13.5px}
.ag b{font-weight:400;color:var(--tx2)}.ag .v{font-variant-numeric:tabular-nums}
.ag .s,.ag .q{display:none}
@container res (min-width:260px){.ag .s{display:block;grid-column:1/-1;color:var(--dim);font-size:12px}.ag .q{display:block;grid-column:1/-1;height:2px;background:var(--faint);margin-top:3px;border-radius:2px}.ag .q i{display:block;height:100%;background:var(--tx2);border-radius:2px}.ag .q i.hot{background:var(--att)}.ag .q i.red{background:var(--bad)}}
/* inbox: one column; the chosen item opens in place, options follow the text */
.grp{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--dim);margin:10px 0 2px;letter-spacing:.04em}.grp:first-child{margin-top:0}
.grp .gn{font-variant-numeric:tabular-nums}.grp .gt{margin-left:auto;opacity:0;transition:opacity .15s;letter-spacing:0}#inbox:hover .grp .gt{opacity:1}.grp .gt button{color:var(--dim);font-size:12px}.grp .gt button:hover{color:var(--tx)}
.unfold{display:block;margin:2px 0 4px 20px;color:var(--dim);font-size:12.5px}.unfold:hover{color:var(--tx)}
.it{display:grid;grid-template-columns:8px minmax(0,1fr);gap:0 12px;padding:6px 10px;margin:0 -10px;border-radius:8px;cursor:pointer}
.it:hover{background:var(--s1)}.it.sel{background:var(--s1);cursor:default}.it>i{margin-top:8px}
.it .t1{display:flex;gap:10px;align-items:baseline;min-width:0}
.it .t1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t1 small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .more{display:none;grid-column:2;max-width:760px}.it.sel .more{display:block}
.it .ctx{color:var(--tx2);font-size:13px;margin:4px 0 8px}
.it .opts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.it .opt{color:var(--tx);font-size:13px;padding:1px 0;border-bottom:1px solid transparent}
.it .opt b{color:var(--att);font-weight:600;margin-right:5px}.it .opt small{color:var(--dim);margin-left:6px;font-size:12px}
.it .opt:hover{border-bottom-color:var(--att)}
.it .say{display:block;width:100%;margin-top:8px;background:transparent;border:0;border-bottom:1px solid var(--faint);color:var(--tx);font:inherit;font-size:13px;padding:4px 0;outline:none}
.it .say:focus{border-bottom-color:var(--tx2)}
/* detail */
.det-wrap{container-type:size;container-name:det}
.dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dh h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.015em}.dh small{color:var(--dim);font-size:13px}
.own{display:flex;gap:18px;color:var(--dim);font-size:12.5px;margin:4px 0 20px;flex-wrap:wrap}.own b{color:var(--tx2);font-weight:400}
.det{display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
.stg{display:grid;grid-template-columns:14px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:16px}
.stg::before{content:'';position:absolute;left:6px;top:18px;bottom:0;width:1px;background:var(--faint)}.stg:last-child::before{display:none}
.stg>i{width:12px;height:12px;border-radius:50%;border:2px solid var(--dim);margin-top:5px;background:var(--bg);z-index:1}
.stg.done>i{background:var(--dim)}.stg.run>i{border-color:var(--tx)}.stg.att>i{border-color:var(--att);background:var(--att)}
.stg .h{display:flex;gap:10px;align-items:baseline}.stg .h em{font-style:normal;color:var(--dim);font-size:12px}.stg.done .h span{color:var(--dim)}
.pk{display:flex;flex-direction:column;gap:2px;margin-top:4px}.pk div{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--tx2)}.pk em{font-style:normal;color:var(--dim);font-size:11.5px}
.act{display:none}.act h4{margin:4px 0 8px;font-size:12px;color:var(--dim);font-weight:400;letter-spacing:.06em}
.act div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;font-size:12.5px;color:var(--tx2);padding:2px 0}.act time{color:var(--dim)}
@container det (min-width:880px){.det{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.act{display:block}}
@container det (max-height:200px){.pk,.act,.own{display:none}}
.n .tw{cursor:pointer}.tree-note{color:var(--tx2);margin:0 0 10px;white-space:pre-wrap}.dw-pre{overflow-wrap:anywhere}.pane:focus-within .lbl .hide{opacity:1}
</style>
<style>
/* console-only additions, styled with the same v4 tokens.
   No divider lines: the drawer is separated with a shadow, not a border. */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);background:var(--s2);color:var(--tx);border-radius:999px;padding:9px 20px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.it .err{grid-column:2;color:var(--bad);font-size:12.5px;margin-top:6px}
.keys{margin-top:12px}
.keys td{padding:2px 14px 2px 0;color:var(--tx2);font-size:12.5px;vertical-align:top;white-space:nowrap}
.keys td:first-child{color:var(--tx)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:30;display:none}.veil.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:var(--s1);box-shadow:-10px 0 36px rgba(0,0,0,.35);transform:translateX(103%);transition:transform .18s ease;z-index:31;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dw-h{display:flex;gap:12px;align-items:flex-start;padding:24px 28px 12px}
.dw-h h3{margin:0;font-size:20px;font-weight:600;flex:1;line-height:1.4;word-break:break-all}
.dw-h h3 small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
.dw-x{font-size:18px;color:var(--dim)}.dw-x:hover{color:var(--tx)}
.dw-b{overflow:auto;padding:0 28px 30px;flex:1}
.dw-kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 14px;font-size:13.5px;margin:6px 0 18px}
.dw-kv dt{color:var(--dim)}.dw-kv dd{margin:0;word-break:break-all}
.dw-r{border-radius:8px;background:color-mix(in srgb,var(--bad) 12%,var(--s2));padding:8px 12px;color:var(--tx2);font-size:13px;margin-bottom:14px;word-break:break-all}
.dw-lbl{font-size:12px;color:var(--dim);letter-spacing:.06em;margin:18px 0 6px}
.dw-pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;padding:12px 14px;margin:0;font:12.5px/1.65 "Cascadia Mono",Consolas,"Microsoft YaHei UI",monospace;color:var(--tx2);max-height:44vh;overflow:auto}
.dw-lnk{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dw-lnk a,.dw-lnk button{font-size:12.5px;border-radius:6px;padding:2px 10px;color:var(--tx2);text-decoration:none;background:var(--s2)}
.dw-lnk a:hover,.dw-lnk button:hover{color:var(--tx)}
.dw-act{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:4px 0 6px}
.dw-act time{color:var(--dim);font-variant-numeric:tabular-nums}.dw-act span{color:var(--tx2)}
.dw-empty{color:var(--dim);font-size:14px}
.dw-st-ok{color:var(--tx2)}.dw-st-bad{color:var(--bad)}.dw-st-warn{color:var(--att)}.dw-st-run{color:var(--tx)}
.n .tw{cursor:pointer}.tree-note{color:var(--tx2);margin:0 0 10px;white-space:pre-wrap}.dw-pre{overflow-wrap:anywhere}.pane:focus-within .lbl .hide{opacity:1}
</style></head><body>

<div class="shell" id="shell">
 <div class="col" id="cL">
  <section class="pane" id="tree"><div class="lbl">任务树<span class="n" id="treeCount"></span><span class="sp"></span><button class="hide" data-hide="tree">收起</button></div>
   <div class="body tree-wrap"><div class="ol" id="ol"></div><div class="mm" id="mm"><svg id="mmsvg"></svg></div></div></section>
  <div class="gut h" data-split="lv"></div>
  <section class="pane" id="res"><div class="lbl">AI 资源<span class="sp"></span><button class="hide" data-hide="res">收起</button></div>
   <div class="body res-wrap" id="resb"></div></section>
 </div>
 <div class="gut v" data-split="lw"></div>
 <div class="col" id="cR">
  <section class="pane" id="inbox"><div class="lbl">需要处理的事<span class="n att" id="inboxCount"></span><span class="sp"></span><button class="hide" data-hide="inbox">收起</button></div>
   <div class="body" id="list"></div></section>
  <div class="gut h" data-split="rv"></div>
  <section class="pane" id="det"><div class="lbl"><span class="sp"></span><button class="hide" data-hide="det">收起</button></div>
   <div class="body det-wrap"><div id="detBody"></div></div></section>
 </div>
 <div class="hero" id="hero"><h1><span class="dot"></span><span id="heroH">正在读取协作状态</span></h1><p id="heroP"></p><p style="font-size:13px;color:var(--dim)">鼠标移到屏幕边缘，或按 <kbd>0</kbd> 还原</p></div>
</div>
<!-- invisible edge handles: appear only when something is hidden there -->
<div class="edge l" id="eL" data-edge="left" hidden><span class="hint"></span><span class="pill">任务树 · AI 资源 →</span></div>
<div class="edge t" id="eT" data-edge="inbox" hidden><span class="hint"></span><span class="pill">↓ 需要处理的事</span></div>
<div class="edge b" id="eB" data-edge="det" hidden><span class="hint"></span><span class="pill">↑ 任务细节</span></div>
<div class="help" id="help"><div><b style="color:var(--tx)">收起与拉出</b><br>收起：鼠标移到区域标题，点“收起”；或按 <kbd>[</kbd> <kbd>i</kbd> <kbd>d</kbd> <kbd>r</kbd><br>拉出：鼠标移到对应的屏幕边缘（左 / 上 / 下），点一下或往里拖<br>调大小：拖区域之间的空白处 · 双击恢复<br><kbd>f</kbd> 只看任务细节 · <kbd>0</kbd> 全部还原
 <table class="keys"><tbody>
  <tr><td><kbd>[</kbd></td><td>收起 / 还原左栏（任务树 · AI 资源）</td></tr>
  <tr><td><kbd>i</kbd></td><td>收起 / 还原「需要处理的事」</td></tr>
  <tr><td><kbd>d</kbd></td><td>收起 / 还原「任务细节」</td></tr>
  <tr><td><kbd>r</kbd></td><td>收起 / 还原「AI 资源」</td></tr>
  <tr><td><kbd>f</kbd></td><td>只看任务细节</td></tr>
  <tr><td><kbd>0</kbd></td><td>全部还原</td></tr>
  <tr><td><kbd>?</kbd></td><td>显示 / 隐藏本帮助</td></tr>
 </tbody></table></div></div>
<div class="foot"><a style="color:inherit" href="/codex-collab/legacy-window">协作记录与连接</a> · <button id="th">深浅</button> · <button id="openArchive">归档</button> · <button id="hp">?</button></div>
<div class="toast" id="toast"></div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dw-h"><h3 id="dwT"></h3><button class="dw-x" id="dwX" title="关闭 (Esc)">✕</button></div><div class="dw-b" id="dwB"></div></aside>

<script src="/codex-collab/win-ui/console.js"></script>
</body></html>
