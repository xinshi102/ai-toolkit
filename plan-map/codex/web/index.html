<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计划导图</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#243149;background:#f5f7fb}header{padding:22px 26px;background:white;border-bottom:1px solid #e1e6ef;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:22px}button,select{font:inherit;border:1px solid #d8deea;border-radius:8px;background:white;padding:8px 12px;color:inherit;cursor:pointer}button:hover{background:#eef2ff}#plans{margin-left:auto;max-width:250px}.summary{margin:18px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pill{padding:10px 14px;border-radius:10px;background:white}#current{color:#3656c8;background:#e8eeff;font-weight:600}.bar{height:7px;width:150px;background:#dfe5ef;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#22a075}main{display:flex;margin:0 24px 24px;gap:16px}#canvas{flex:1;height:65vh;min-height:350px;overflow:auto;border:1px solid #e0e5ed;border-radius:16px;background:white}svg{display:block}aside{width:265px;padding:20px;border:1px solid #e0e5ed;border-radius:16px;background:white;align-self:flex-start}aside h2{font-size:17px;margin-top:0}aside p{line-height:1.7;white-space:pre-wrap}label{display:block;margin:15px 0 8px}aside select{width:100%}#error{color:#a12c3c;margin:8px 24px;white-space:pre-wrap}footer{font-size:12px;color:#78849b;margin:0 24px 20px}.node{cursor:pointer}.node:focus rect{stroke-width:3}#hint{color:#78849b}.legend{display:flex;gap:14px;font-size:12px;margin:12px 24px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:100%}#notice{position:fixed;right:20px;bottom:20px;border-radius:12px;background:#26364f;color:white;padding:14px 20px;display:none}@media(max-width:700px){main{flex-direction:column}aside{width:100%}header{padding:16px}#canvas{height:50vh}}@media(prefers-color-scheme:dark){body{background:#171e2a;color:#e0e7f5}header,aside,#canvas,.pill{background:#222c3b;border-color:#394458}button,select{background:#293548;color:#e0e7f5;border-color:#435069}#current{background:#2c3f6b;color:#c9d6ff}}

[hidden]{display:none!important}header{padding:10px 14px;position:relative;flex-wrap:nowrap;gap:8px}h1{font-size:15px}#headerCount{font-size:12px;color:#8694a8}#more{margin-left:auto;font-size:22px;border:0;padding:0 8px;background:transparent}#plans{max-width:160px;margin:0}#options{position:absolute;top:44px;right:10px;width:min(350px,calc(100vw - 20px));padding:12px;background:#fff;border:1px solid #d8deea;border-radius:12px;z-index:10;box-shadow:0 8px 30px #0002}.option-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}.option-row>span{width:30px;color:#8490a2;font-size:12px}#options button,#options select{font-size:12px;padding:6px 8px}#options .legend{margin:8px 0}#options footer{margin:10px 0 0;line-height:1.6;font-size:11px}.summary{margin:10px 14px;gap:8px;font-size:12px}.summary .pill{padding:0;background:transparent}#current{width:100%;padding:5px 8px;font-weight:500}.bar{flex:1;height:4px}main{margin:0 10px 10px;position:relative;gap:8px}#canvas{height:calc(100vh - 125px);min-height:300px;border-radius:8px}#details{position:absolute;right:6px;bottom:6px;max-height:70%;overflow:auto;width:min(300px,calc(100% - 12px));padding:14px;box-shadow:0 8px 30px #0002}#closeDetail{float:right;padding:0 5px;border:0;font-size:20px}#hint{display:none}#details h2{font-size:14px}#error:empty{display:none}button[aria-pressed=true]{background:#e8eeff;color:#3656c8}label{font-size:12px}@media(prefers-color-scheme:dark){#options{background:#222c3b;border-color:#394458}button[aria-pressed=true]{background:#2c3f6b;color:#c9d6ff}}

header{padding:7px 12px;border-bottom:0;background:transparent;height:36px}h1{font-size:13px;font-weight:600}#headerCount,#percent{font-size:11px;color:#8190a5}#percent{margin-left:auto;font-variant-numeric:tabular-nums}#more{margin-left:0;font-size:20px}.summary{margin:0 12px 4px;line-height:18px}#current{padding:0 2px;background:transparent!important;color:#7389b5;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{margin:0 6px 6px;display:block}#canvas{height:auto;min-height:180px;max-height:calc(100vh - 64px);border:0;border-radius:6px;background:transparent}svg{transition:height 200ms ease,width 200ms ease}#details{width:clamp(160px,46%,210px);min-height:0;max-height:clamp(100px,45%,230px);padding:10px 12px;right:6px;bottom:6px;border-radius:10px;font-size:11px;box-shadow:0 4px 18px #0002;backdrop-filter:blur(14px)}#details h2{font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 18px 5px 0}#details #note{font-size:11px;line-height:16px;margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#closeDetail{font-size:16px;line-height:18px;padding:0;border-radius:4px}#editDetails summary{cursor:pointer;color:#7e8eac;list-style:none;font-size:11px}#editDetails summary::before{content:'› ';}#editDetails[open] summary::before{content:'⌄ ';}#details label{margin:8px 0 3px;font-size:10px}#details select{padding:4px 6px;font-size:11px}#save{font-size:11px;margin-top:8px;padding:4px 8px}#options{top:34px;font-size:11px}#notice{font-size:11px;padding:8px 12px;bottom:10px;right:10px}.node rect{transition:fill 150ms ease,stroke 150ms ease}@media(prefers-reduced-motion:reduce){svg,.node rect{transition:none}}

#details{position:relative;right:auto;bottom:auto;margin:6px 6px 0 auto;max-height:180px;background:#fff}#details:has(#editDetails[open]){max-height:230px}@media(prefers-color-scheme:dark){#details{background:#222c3b}}
html,body{height:auto;min-height:0}body{overflow-x:hidden}#canvas{min-height:80px;max-height:800px}svg{transition:height 200ms ease}#map{display:block;margin:0 auto}#details{max-width:210px}

.pm-link{stroke:#94a3b8;stroke-width:1.3;stroke-linecap:round;transition:opacity .15s,stroke .15s}.pm-link[data-path=true]{stroke:#6366f1;stroke-width:1.8}.pm-link[data-dim=true]{opacity:.22}
.pm-card{cursor:grab;transition:opacity .15s;touch-action:none;user-select:none}.pm-card-box{fill:#f8fafc;stroke:var(--pm-status);stroke-width:1;stroke-opacity:.38;transition:stroke-opacity .15s,stroke-width .15s,fill .15s}.pm-card[data-root=true] .pm-card-box{stroke-opacity:.5;fill:#eef2ff}.pm-card:hover .pm-card-box{stroke-opacity:.9}.pm-card[data-selected=true] .pm-card-box{stroke:#6366f1;stroke-width:2;stroke-opacity:1}.pm-card[data-drop=true] .pm-card-box{stroke:#22c55e;stroke-dasharray:5 3;stroke-width:2;stroke-opacity:1}.pm-card[data-dim=true]{opacity:.3}.pm-card[data-dragging=true]{cursor:grabbing;opacity:.8;pointer-events:none}
.pm-title{fill:#26364f}.pm-card[data-root=true] .pm-title{font-weight:600}.pm-card[data-status=done] .pm-title{opacity:.55}.pm-status{fill:var(--pm-status)}.pm-note{fill:#64748b;opacity:.4}.pm-toggle{opacity:0;cursor:pointer;transition:opacity .15s}.pm-toggle[data-folded=true],.pm-card:hover .pm-toggle,.pm-card[data-selected=true] .pm-toggle,.pm-toggle:focus{opacity:1}.pm-toggle circle{fill:white;stroke:#94a3b8;stroke-opacity:.4}.pm-toggle text{fill:#6366f1}.pm-rename{width:100%;height:100%;font:11px system-ui;border:1px solid #6366f1;border-radius:4px;padding:0 3px;box-sizing:border-box;background:white;color:#26364f}
#canvas{position:relative;touch-action:none}#canvas[data-panning=true]{cursor:grabbing}#dragHint{position:fixed;bottom:10px;left:10px;padding:5px 9px;border-radius:6px;background:#26364f;color:white;font-size:11px;pointer-events:none;z-index:15}

#details{width:min(100%,420px);max-width:420px;margin:10px 6px;max-height:260px}#details #note{display:block;overflow:auto;max-height:160px;-webkit-line-clamp:unset;font-size:12px;line-height:1.65}#details h2{white-space:normal;font-size:14px}body{background:transparent}#canvas{overscroll-behavior:contain}.pm-card:focus-visible .pm-card-box{stroke:#6366f1;stroke-width:2;stroke-opacity:1}

#blockedReason{width:100%;font:inherit;border:1px solid #d8deea;border-radius:6px;padding:6px}#details:has(#editDetails[open]){max-height:420px}#dependencies{min-height:80px}

/* Node inspector: a quiet continuation of the map, with explicit status and ancestry. */
#details{position:relative;width:calc(100% - 12px);max-width:none;margin:12px 6px 0;padding:14px 4px 4px;border:0;border-top:1px solid #dce1e9;border-radius:0;box-shadow:none;backdrop-filter:none;background:transparent;max-height:300px;scrollbar-width:thin;scrollbar-color:#c2cad6 transparent}
.detail-heading{display:flex;align-items:flex-start;gap:10px;min-width:0}
#details h2{flex:1;min-width:0;margin:1px 0 0;font-size:13px;font-weight:600;line-height:1.6;overflow-wrap:anywhere;color:#243149}
#detailStatus{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;margin-top:2px;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:500;line-height:18px;color:#526174;background:#edf0f4}
#detailStatus::before{content:"";width:5px;height:5px;border-radius:50%;background:#7b8798}
#detailStatus[data-status=done]{color:#247149;background:#eaf4ed}#detailStatus[data-status=done]::before{background:#34855b}
#detailStatus[data-status=active]{color:#355eb3;background:#edf2fc}#detailStatus[data-status=active]::before{background:#507bc9}
#detailStatus[data-status=blocked]{color:#a74448;background:#faeeee}#detailStatus[data-status=blocked]::before{background:#b85c60}
#closeDetail{float:none;display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;margin:-1px -3px 0 0;padding:0;border:0;border-radius:6px;color:#64748b;background:transparent;cursor:pointer}
#closeDetail:hover{background:#edf0f4;color:#243149}#closeDetail:focus-visible,#editDetails summary:focus-visible{outline:2px solid #6366f1;outline-offset:2px}
#detailPath{margin:4px 34px 0 0;color:#66758a;font-size:11px;line-height:1.6;overflow-wrap:anywhere}
#details #note{display:block;margin:9px 32px 10px 0;max-height:132px;overflow:auto;font-size:12px;line-height:1.7;color:#4b5b70;scrollbar-width:thin}
#editDetails{margin-top:10px}#editDetails summary{display:inline-flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;line-height:18px;color:#596b85;border-radius:3px}
#editDetails summary::before{content:"";display:inline-block;width:5px;height:5px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(-45deg);margin:0 3px 0 1px}
#editDetails[open] summary::before{content:"";transform:rotate(45deg)}#editDetails[open]{padding-top:4px}#editDetails[open] summary{color:#355eb3}
#details:has(#editDetails[open]){max-height:440px}#details select,#blockedReason{background:#fff;color:#243149}#details label{font-size:11px;margin-top:12px}
@media(prefers-color-scheme:dark){#details{background:transparent;border-top-color:#ffffff18;scrollbar-color:#555961 transparent}#details h2{color:#e5e7eb}#detailPath{color:#a1a6b0}#details #note{color:#bdc2cc}#detailStatus{color:#b7becb;background:#ffffff09}#detailStatus[data-status=done]{color:#a0c8ad;background:#8ec9a110}#detailStatus[data-status=active]{color:#aabfe7;background:#8aa8e014}#detailStatus[data-status=blocked]{color:#d9abab;background:#cb939314}#closeDetail{color:#a0a7b3}#closeDetail:hover{background:#ffffff0c;color:#e5e7eb}#editDetails summary{color:#a0aec5}#editDetails[open] summary{color:#b4c5e6}#details select,#blockedReason{background:#202125;color:#e5e7eb;border-color:#ffffff20}}
@media(max-width:420px){.detail-heading{gap:6px}#details{padding-top:11px}#details h2{font-size:12px}#detailPath{font-size:10px}#details #note{margin-right:4px}}
</style></head><body><header><h1>计划导图</h1><span id="headerCount"></span><span id="percent" title="工作项完成进度"></span><button id="more" aria-label="导图选项" aria-expanded="false" aria-controls="options">⋯</button><div id="options" hidden><div class="option-row"><span>计划</span><select id="plans" aria-label="选择计划"></select><button id="refresh">刷新</button><button id="history">变更记录</button></div><div class="option-row"><span>方向</span><button id="horizontal">横向</button><button id="vertical">纵向</button></div><div class="option-row"><span>缩放</span><button id="fit">全局计划</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="compact">紧凑</button><button id="size">展开画布</button></div><div class="option-row"><span>分支</span><button id="expand">全部展开</button><button id="collapse">全部折叠</button><button id="autoLayout" hidden>自动布局</button></div><div class="legend"><span><i class="dot" style="background:#94a3b8"></i>待办</span><span><i class="dot" style="background:#3b82f6"></i>进行中</span><span><i class="dot" style="background:#22c55e"></i>完成</span><span><i class="dot" style="background:#ef4444"></i>阻塞</span></div><footer id="saved"></footer></div></header><div class="summary"><div id="current" class="pill">等待计划</div><b id="count" hidden>0 / 0</b><span id="progress" hidden></span></div><div id="error" role="alert"></div><main><div id="canvas"><svg id="map" aria-label="计划树"></svg></div><aside id="details" hidden><div class="detail-heading"><h2 id="detailTitle">选择一个步骤</h2><span id="detailStatus"></span><button id="closeDetail" aria-label="关闭详情"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div><p id="detailPath"></p><p id="hint">点击节点查看详情。点击节点旁的圆点折叠分支。</p><p id="note"></p><div id="editor" hidden><details id="editDetails"><summary>编辑节点</summary><label for="status">状态</label><select id="status"><option value="pending">待办</option><option value="active">进行中</option><option value="done">完成</option><option value="blocked">阻塞</option></select><label for="parent">所在分支</label><select id="parent"></select><label for="dependencies">依赖任务</label><select id="dependencies" multiple size="4"></select><label for="blockedReason">阻塞原因</label><textarea id="blockedReason" rows="2" maxlength="2000"></textarea><button id="save">保存修改</button></details></div></aside></main><div id="dragHint" hidden></div><div id="notice" role="status">已保存</div><script type="module" src="/app.js"></script></body></html>
