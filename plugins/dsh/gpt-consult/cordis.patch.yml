# gpt-consult bundle patch：主机行 + 默认配置。
- insert:
    - id: gpt-consult
      name: '@local/dsh-gpt-consult'
      config:
        # OpenAI 兼容端点（chat/completions）。任何兼容服务都可填。
        baseURL: 'https://api.openai.com/v1'
        model: 'gpt-5'
        # 从哪个环境变量读 API key（宿主进程环境）；插件不存储、不传递密钥
        apiKeyEnv: 'OPENAI_API_KEY'
        # 单次请求超时（毫秒）
        timeoutMs: 60000
        # 附带上下的最大字符数
        maxContextChars: 12000
        # 系统提示：第二意见的角色定位
        systemPrompt: 'You are a rigorous second-opinion reviewer. Answer in Chinese. Be concise, concrete, and flag risks the caller may have missed.'
